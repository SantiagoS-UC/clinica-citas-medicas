<header class="encabezado text-white">
  <div class="container-fluid px-3 px-lg-5 py-3">
    <div class="d-flex flex-column flex-lg-row align-items-center justify-content-between gap-3">
      <a href="#" class="marca d-flex align-items-center gap-3 text-white text-decoration-none">
        <img src="img/logo.png" alt="Logo de la clínica" class="logo" width="56" height="56" />
        <div class="text-center text-lg-start">
          <h1 class="h3 mb-0 fw-bold">{{ nombreClinica }}</h1>
          <small class="opacity-75">{{ lema }}</small>
        </div>
      </a>

      <ul class="list-unstyled d-none d-xxl-flex gap-4 mb-0 small datos-contacto">
        <li><i class="bi bi-geo-alt-fill"></i> Calle 5 # 10-20, Popayán</li>
        <li><i class="bi bi-clock-fill"></i> Lun - Sáb · 7:00 a.m. - 7:00 p.m.</li>
        <li><i class="bi bi-telephone-fill"></i> (602) 820 1234</li>
      </ul>

      <div class="d-flex gap-2">
        @for (red of redes; track red.nombre) {
          <a [href]="red.url" target="_blank" rel="noopener" class="red-social"
             [title]="red.nombre" [attr.aria-label]="red.nombre">
            <i class="bi" [class]="red.icono"></i>
          </a>
        }
      </div>
    </div>
  </div>
</header>
