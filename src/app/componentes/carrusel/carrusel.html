<section id="promociones" class="seccion pt-4 pt-md-5">
  <div class="container">
    <div class="text-center mb-4">
      <span class="subtitulo-seccion">Este mes</span>
      <h2 class="titulo-seccion">Promociones especiales</h2>
    </div>

    <!-- El carrusel se adapta al ancho del div padre -->
    <div class="contenedor-carrusel">
      <div #carrusel id="carruselPromociones" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-interval="5000">
        <div class="carousel-indicators">
          @for (promo of promociones; track promo.titulo; let i = $index) {
            <button type="button" data-bs-target="#carruselPromociones" [attr.data-bs-slide-to]="i"
                    [class.active]="i === 0" [attr.aria-current]="i === 0 ? 'true' : null"
                    [attr.aria-label]="'Promoción ' + (i + 1)"></button>
          }
        </div>

        <div class="carousel-inner">
          @for (promo of promociones; track promo.titulo; let i = $index) {
            <div class="carousel-item" [class.active]="i === 0">
              <img [src]="promo.imagen" class="d-block w-100 img-promo" [alt]="promo.titulo" />
              <div class="texto-promo">
                <span class="badge etiqueta-promo mb-2">{{ promo.etiqueta }}</span>
                <h3 class="fw-bold">{{ promo.titulo }}</h3>
                <p class="d-none d-sm-block">{{ promo.descripcion }}</p>
                <a href="#registro" class="btn btn-light btn-sm rounded-pill px-3 fw-semibold">
                  ¡Lo quiero! <i class="bi bi-chevron-right"></i>
                </a>
              </div>
            </div>
          }
        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#carruselPromociones" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Anterior</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carruselPromociones" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Siguiente</span>
        </button>
      </div>
    </div>
  </div>
</section>
